<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="aC9VZsAXedQcrjcyII4WS29_XNSqBu2rG_cf-rvPHik" />
    <title>CoreByte Lab</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #020b14;
            color: #e0f2fe;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .container {
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(0, 180, 216, 0.25);
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        h1 span {
            color: #00b4d8;
        }

        p {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .links {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }

        .link-button {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #00b4d8;
            color: #00b4d8;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .link-button:hover {
            background-color: #00b4d8;
            color: #020b14;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Logo em Base64 -->
        <img class="logo" 
             src="unnamed.png" 
             alt="CoreByte Lab Logo">

        <h1>CoreByte <span>Lab</span></h1>
        
        <p>Desenvolvimento de soluções em software, aplicativos móveis e tecnologia aplicada.</p>

        <div class="links">
            <a href="https://play.google.com/store/apps/dev?id=8601470674019819358" class="link-button">Apps na PlayStore</a>
        </div>
    </main>

    <footer>
        &copy; CoreByte Lab. Todos os direitos reservados.
    </footer>

</body>
</html>
