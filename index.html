            color: #e0f2fe;

            gap: 20px;

        h1 {

            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        h1 span {
            color: #00b4d8;
        }

        p {
            font-size: 1.05rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .links {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }

        .link-button {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid #00b4d8;
            color: #00b4d8;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .link-button:hover {
            background-color: #00b4d8;
            color: #020b14;
            box-shadow: 0 0 15px rgba(0, 180, 216, 0.4);

        footer {
